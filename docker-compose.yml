services:
  frontend:
    image: nikitasreenath/nikisaunak-frontend:${IMAGE_TAG}
    pull_policy: always
    build: ./frontend
    ports:
      - "8080:80"

  backend:
    image: nikitasreenath/nikisaunak-backend:${IMAGE_TAG}
    pull_policy: always
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      TRANSIT_511_API_KEY: "${TRANSIT_511_API_KEY}"
    volumes:
      - wordle_data:/app/data

  invite:
    image: nikitasreenath/nikisaunak-invite:${IMAGE_TAG}
    pull_policy: always
    build: ./invite
    ports:
      - "8081:80"


volumes:
  wordle_data: